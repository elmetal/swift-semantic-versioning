name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 形式仕様と証明。警告をエラー扱いにしているので、sorry が残っていると失敗する。
  lean:
    name: Lean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Formal/lean-toolchain のバージョンを入れて `lake build` を実行する。
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Formal

      # Swift のテストが読むベクタが、現在の Lean の定義から生成したものと一致することを確かめる。
      - name: Check that test vectors are up to date
        working-directory: Formal
        run: |
          lake exe vectors ../Tests/SemanticVersioningTests/Vectors
          if [ -n "$(git status --porcelain -- ../Tests/SemanticVersioningTests/Vectors)" ]; then
            echo "::error::Test vectors are out of date. Run 'lake exe vectors ../Tests/SemanticVersioningTests/Vectors' in Formal/ and commit the result."
            git status --short -- ../Tests/SemanticVersioningTests/Vectors
            git diff --stat -- ../Tests/SemanticVersioningTests/Vectors
            exit 1
          fi

  swift-linux:
    name: Swift (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift test

  swift-macos:
    name: Swift (macOS)
    # Swift 6.4 を含む Xcode 27 のイメージ。
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - run: swift --version
      - run: swift test
